server:
  port: 8082
spring:
  application:
    name: usuarios
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
  datasource:
    url: jdbc:postgresql://localhost:5432/usuarios
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
